function DoughnutChart({ data, colors, id, th }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "doughnut",
      data: { labels: data.map((d) => d.name), datasets: [{ data: data.map((d) => d.value), backgroundColor: colors, borderColor: th.card, borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [JSON.stringify(data), th]);
  return (
    <div>
      <div style={{ position: "relative", height: 180 }}><canvas ref={ref} role="img" aria-label={id}></canvas></div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 10, fontSize: 12, color: th.textSecondary }}>
        {data.map((d, i) => (<span key={i} style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: colors[i % colors.length] }}></span>{d.name} — {fmt(d.value)}</span>))}
      </div>
    </div>
  );
}

function App({ onLogout }) {
  const saved = loadInitial();
  const [theme, setThemeName] = useState(saved && saved.themeName || "light");
  const [lang, setLang] = useState(saved && saved.lang || "uz");
  const [page, setPage] = useState("dashboard");
  const [filterYear, setFilterYear] = useState("barchasi");
  const [filterMonth, setFilterMonth] = useState("barchasi");
  const [filterDay, setFilterDay] = useState("barchasi");
  const [toast, setToast] = useState("");
  const [modal, setModal] = useState(null);
  const [clearError, setClearError] = useState("");
  const [connectState, setConnectState] = useState({});
  const [navOrder, setNavOrder] = useState((saved && saved.navOrder) || NAV.map((n) => n.key));
  const dragItemRef = useRef(null);
  const uploadSectionRef = useRef(null);

  const [sales, setSales] = useState((saved && saved.sales) || seedSales);
  const [income, setIncome] = useState((saved && saved.income) || seedIncome);
  const [warehouse, setWarehouse] = useState((saved && saved.warehouse) || seedWarehouse);
  const [expenses, setExpenses] = useState((saved && saved.expenses) || seedExpenses);
  const [employees, setEmployees] = useState((saved && saved.employees) || seedEmployees);
  const [clients, setClients] = useState((saved && saved.clients) || seedClients);
  const [transfers, setTransfers] = useState((saved && saved.transfers) || seedTransfers);
  const [messages, setMessages] = useState((saved && saved.messages) || seedMessages);
  const [kassaInitial, setKassaInitial] = useState((saved && saved.kassaInitial) || 0);
  const [kassaManual, setKassaManual] = useState((saved && saved.kassaManual) || []);
  const [debtPayments, setDebtPayments] = useState((saved && saved.debtPayments) || []);
  const [clientDebtPayments, setClientDebtPayments] = useState((saved && saved.clientDebtPayments) || []);
  const [orgs, setOrgs] = useState(() => {
    if (saved && saved.orgs) return saved.orgs;
    if (saved && saved.org && Object.keys(saved.org).length) return [Object.assign({ id: 1 }, saved.org)];
    return [];
  });
  const [kassaToBank, setKassaToBank] = useState((saved && saved.kassaToBank) || []);
  const [selectState, setSelectState] = useState({});

  const th = theme === "dark" ? DARK : LIGHT;
  const t = DICT[lang];
  const MONTHS = lang === "uz" ? MONTHS_UZ : MONTHS_RU;

  function handleRefresh() {
    showToast(t.yangilandi);
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }

  function persistAll(next) {
    const data = Object.assign({ themeName: theme, lang, sales, income, warehouse, expenses, employees, clients, transfers, messages, navOrder, kassaInitial, kassaManual, debtPayments, kassaToBank, clientDebtPayments, orgs }, next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function handleSave(section) {
    persistAll({});
    if (section) syncToSheet(section);
    showToast(t.saqlandi);
  }

  function getConnect(section) { return connectState[section] || { url: "", connected: false, fileName: "" }; }
  function updateConnect(section, patch) {
    setConnectState((prev) => Object.assign({}, prev, { [section]: Object.assign({}, getConnect(section), patch) }));
  }

  function getList(section) {
    return { sotuv: sales, kirim: income, xarajatlar: expenses, otkazmalar: transfers, mijozlar: clients, xodimlar: employees, ombor: warehouse }[section] || [];
  }

  async function handleConnectSheets(section) {
    const cs = getConnect(section);
    if (!cs.url || !cs.url.trim()) { showToast(t.tanlanganFaylYoq); return; }
    updateConnect(section, { connected: true });
    try {
      const res = await fetch(cs.url.trim() + "?action=get&section=" + encodeURIComponent(section));
      const json = await res.json();
      const config = IMPORT_CONFIG[section];
      if (config && Array.isArray(json.rows) && json.rows.length) {
        config.setter(json.rows.map((row) => Object.assign({ id: Date.now() + Math.random() }, row)));
      }
      showToast(t.ulandi);
    } catch (err) {
      showToast(t.ulandi + " (" + t.faylXato + ")");
    }
  }

  async function syncToSheet(section) {
    const cs = getConnect(section);
    if (!cs.connected || !cs.url) return;
    try {
      await fetch(cs.url.trim(), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ section, rows: getList(section) }),
      });
    } catch (err) {}
  }

  useEffect(() => {
    ["sotuv", "kirim", "xarajatlar", "xodimlar", "mijozlar", "otkazmalar", "ombor"].forEach((section) => {
      const cs = getConnect(section);
      if (cs.connected && cs.url) syncToSheet(section);
    });
  }, [sales, income, expenses, employees, clients, transfers, warehouse]);

  const SELECT_SETTERS = { sotuv: setSales, kirim: setIncome, xarajatlar: setExpenses, xodimlar: setEmployees, mijozlar: setClients, otkazmalar: setTransfers, tashkilot: setOrgs };
  const SELECT_LISTS = { sotuv: sales, kirim: income, xarajatlar: expenses, xodimlar: employees, mijozlar: clients, otkazmalar: transfers, tashkilot: orgs };

  function getSelect(section) { return selectState[section] || { active: false, ids: [] }; }
  function toggleSelectMode(section) {
    setSelectState((prev) => {
      const cur = prev[section] || { active: false, ids: [] };
      return Object.assign({}, prev, { [section]: { active: !cur.active, ids: [] } });
    });
  }
  function toggleSelectRow(section, id) {
    setSelectState((prev) => {
      const cur = prev[section] || { active: false, ids: [] };
      const ids = cur.ids.includes(id) ? cur.ids.filter((x) => x !== id) : [...cur.ids, id];
      return Object.assign({}, prev, { [section]: { active: true, ids } });
    });
  }
  function deleteSelected(section) {
    const cur = getSelect(section);
    if (!cur.ids.length) return;
    if (!window.confirm(t.ochirishTasdiq)) return;
    const setter = SELECT_SETTERS[section];
    const list = SELECT_LISTS[section];
    if (setter && list) setter(list.filter((item) => !cur.ids.includes(item.id)));
    setSelectState((prev) => Object.assign({}, prev, { [section]: { active: false, ids: [] } }));
    showToast(t.ochirildi);
  }

  function handleDragStart(idx) { dragItemRef.current = idx; }
  function handleDragOver(e) { e.preventDefault(); }
  function handleDrop(idx) {
    const from = dragItemRef.current;
    dragItemRef.current = null;
    if (from === null || from === undefined || from === idx) return;
    setNavOrder((prev) => {
      const arr = prev.slice();
      const moved = arr.splice(from, 1)[0];
      arr.splice(idx, 0, moved);
      persistAll({ navOrder: arr });
      return arr;
    });
  }

  const fileInputRef = useRef(null);
  function handlePickExcel(section) {
    uploadSectionRef.current = section;
    fileInputRef.current && fileInputRef.current.click();
  }

  const IMPORT_CONFIG = {
    sotuv: { columns: [
      { key: "sana" }, { key: "nomi" }, { key: "miqdor", numeric: true }, { key: "narx", numeric: true },
      { key: "jamiSumma", skip: true }, { key: "tolov" }, { key: "xodim" },
    ], setter: setSales },
    kirim: { columns: [
      { key: "sana" }, { key: "nomi" }, { key: "hamkor" }, { key: "miqdor", numeric: true }, { key: "narx", numeric: true },
      { key: "qqs", skip: true }, { key: "narxQqs", skip: true }, { key: "jamiSumma", skip: true }, { key: "tolov" }, { key: "holat" },
    ], setter: setIncome },
    xarajatlar: { columns: [
      { key: "sana" }, { key: "nomi" }, { key: "miqdor", numeric: true }, { key: "narx", numeric: true }, { key: "hisob" }, { key: "izoh" },

      const summaVal = Number(f.summa || 0);

      addRow(setKassaToBank, kassaToBank, { sana: f.sana || today, summa: summaVal, izoh: f.izoh || "" });
    } else if (modal.type === "kassaManual") {
      const hamkorNomi = f.hamkor || "";
      const kimgaTuri = f.kimgaTuri || "mijoz";
      const summaVal = Number(f.summa || 0);
      const turiVal = f.turi || "kirim";
      if (turiVal === "chiqim" && !checkFunds("Naxt", summaVal)) return;
      addRow(setKassaManual, kassaManual, { sana: f.sana || today, turi: turiVal, summa: summaVal, izoh: f.izoh || "", hamkor: hamkorNomi, kimgaTuri: turiVal === "chiqim" ? kimgaTuri : "" });
      if (turiVal === "chiqim" && hamkorNomi && kimgaTuri === "mijoz") {
        const oldQoldiq = (qarzPerPartner.find((q) => q.hamkor === hamkorNomi) || { qoldiq: 0 }).qoldiq;
        if (oldQoldiq > 0) {
          const paid = Math.min(summaVal, oldQoldiq);
          addRow(setDebtPayments, debtPayments, { sana: f.sana || today, hamkor: hamkorNomi, summa: paid });
          if (oldQoldiq - paid <= 0) pushMessage(t.qarzTolandi + ": " + hamkorNomi);
        }
      }
    }
    closeModal();
  }

        )}
      </div>
      <div style={{ flex: 1, padding: "24px 32px", overflowX: "hidden" }}>{PAGES[page]()}</div>
      <input type="file" ref={fileInputRef} style={{ display: "none" }} accept=".csv,.xlsx,.xls" onChange={handleFileChosen} />
      {toast && <div style={{ position: "fixed", bottom: 24, right: 24, background: th.text, color: th.page, padding: "10px 18px", borderRadius: 8, fontSize: 13, zIndex: 60 }}>{toast}</div>}
      {modal && (<Modal title={modalTitle} onClose={closeModal} theme={th}>
        {renderModalBody()}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 6 }}>
          <button style={btnGhost} onClick={closeModal}>{t.bekorQilish}</button>
          <button style={modal.type === "clearAll" ? { padding: "9px 16px", borderRadius: 8, border: "none", fontSize: 13, fontWeight: 500, cursor: "pointer", background: th.red, color: "#fff" } : btnGreen} onClick={submitModal}>{modal.type === "clearAll" ? t.tanlanganlarniOchirish : t.saqlash}</button>
        </div>
      </Modal>)}
    </div>
  );
}

const AUTH_KEY = "hisobot_auth_v1";
const SESSION_KEY = "hisobot_session_v1";

async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const data = enc.encode(salt + ":" + password);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function AuthGate() {
  const [account, setAccount] = useState(() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } });
  const [loggedIn, setLoggedIn] = useState(() => { try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) { return false; } });
  const [form, setForm] = useState({});
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [mode, setMode] = useState("auto"); // auto | recover | reset
  const isRegister = !account;
  const screen = isRegister ? "register" : (mode === "auto" ? "login" : mode);

  function upd(patch) { setForm(Object.assign({}, form, patch)); setError(""); }

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    if (screen === "register") {
      if (!form.username || !form.password || !form.password2 || !form.recovery) { setError(DICT.uz.maydonTold); return; }
      if (form.password !== form.password2) { setError(DICT.uz.parolMos); return; }
      const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const hash = await hashPassword(form.password, salt);
      const rSalt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const rHash = await hashPassword(form.recovery.trim().toLowerCase(), rSalt);
      const acc = { username: form.username, hash, salt, rHash, rSalt };
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(acc)); } catch (err) {}
      try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (err) {}
      setAccount(acc);
      setLoggedIn(true);
    } else if (screen === "login") {
      if (!form.username || !form.password) { setError(DICT.uz.maydonTold); return; }
      const hash = await hashPassword(form.password, account.salt);
      if (form.username === account.username && hash === account.hash) {
        try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (err) {}
        setLoggedIn(true);
      } else {
        setError(DICT.uz.loginXato);
      }
    } else if (screen === "recover") {
      if (!form.username || !form.recovery) { setError(DICT.uz.maydonTold); return; }
      const rHash = await hashPassword(form.recovery.trim().toLowerCase(), account.rSalt);
      if (form.username === account.username && account.rHash && rHash === account.rHash) {
        setMode("reset");
        setError("");
      } else {
        setError(DICT.uz.loginXato);
      }
    } else if (screen === "reset") {
      if (!form.newPassword || !form.newPassword2) { setError(DICT.uz.maydonTold); return; }
      if (form.newPassword !== form.newPassword2) { setError(DICT.uz.parolMos); return; }
      const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const hash = await hashPassword(form.newPassword, salt);
      const acc = Object.assign({}, account, { hash, salt });
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(acc)); } catch (err) {}
      setAccount(acc);
      setMode("auto");
      setForm({});
      setInfo(DICT.uz.saqlandi);
    }
  }

  function handleLogout() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    setLoggedIn(false);
    setForm({});
  }

  if (loggedIn) return <App onLogout={handleLogout} />;

  const titles = { register: DICT.uz.royxatdanOtish, login: DICT.uz.kirish, recover: "Parolni tiklash", reset: "Yangi parol o'rnatish" };
  const subtitles = { register: DICT.uz.hisobYarating, login: "Hisobot baza tizimiga kirish", recover: "Login va maxfiy javobingizni kiriting", reset: "Yangi parolingizni kiriting" };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F5F4F0", fontFamily: "inherit" }}>
      <form onSubmit={handleSubmit} style={{ width: 320, background: "#fff", borderRadius: 12, padding: 28, boxShadow: "0 4px 24px rgba(0,0,0,0.08)" }}>
        <div style={{ fontWeight: 600, fontSize: 18, marginBottom: 4, color: "#26241F" }}>{titles[screen]}</div>
        <div style={{ fontSize: 12, color: "#78766E", marginBottom: 18 }}>{subtitles[screen]}</div>

        {(screen === "register" || screen === "login" || screen === "recover") && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>{DICT.uz.login}</div>
            <input value={form.username || ""} onChange={(e) => upd({ username: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        )}

        {(screen === "register" || screen === "login") && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>{DICT.uz.parol}</div>
            <input type="password" value={form.password || ""} onChange={(e) => upd({ password: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        )}
        {screen === "register" && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>{DICT.uz.parolTasdiqla}</div>
            <input type="password" value={form.password2 || ""} onChange={(e) => upd({ password2: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        )}
        {screen === "register" && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>Maxfiy javob (parolni tiklash uchun, masalan: onangizning ismi)</div>
            <input value={form.recovery || ""} onChange={(e) => upd({ recovery: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        )}
        {screen === "recover" && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>Maxfiy javob</div>
            <input value={form.recovery || ""} onChange={(e) => upd({ recovery: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        )}
        {screen === "reset" && (<>
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>Yangi parol</div>
            <input type="password" value={form.newPassword || ""} onChange={(e) => upd({ newPassword: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, color: "#78766E", marginBottom: 4 }}>{DICT.uz.parolTasdiqla}</div>
            <input type="password" value={form.newPassword2 || ""} onChange={(e) => upd({ newPassword2: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #E3E1D9", fontSize: 13 }} />
          </div>
        </>)}

        {error && <div style={{ fontSize: 12, color: "#B3341F", marginBottom: 10 }}>{error}</div>}
        {info && !error && <div style={{ fontSize: 12, color: "#1D6B3B", marginBottom: 10 }}>{info}</div>}

        <button type="submit" style={{ width: "100%", padding: "10px", borderRadius: 8, border: "none", background: "#1D3A5F", color: "#fff", fontWeight: 500, fontSize: 14, cursor: "pointer" }}>
          {titles[screen]}
        </button>

        {screen === "login" && (
          <div style={{ textAlign: "center", marginTop: 14, fontSize: 12, color: "#1D3A5F", cursor: "pointer" }} onClick={() => { setMode("recover"); setForm({}); setError(""); setInfo(""); }}>
            Login yoki parolni unutdingizmi?
          </div>
        )}
        {(screen === "recover" || screen === "reset") && (
          <div style={{ textAlign: "center", marginTop: 14, fontSize: 12, color: "#1D3A5F", cursor: "pointer" }} onClick={() => { setMode("auto"); setForm({}); setError(""); setInfo(""); }}>
            {DICT.uz.kirish}
          </div>
        )}
      </form>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 40, fontFamily: "sans-serif", color: "#26241F" }}>
          <h2>Xatolik yuz berdi</h2>
          <p>Sahifada kutilmagan xatolik chiqdi. Iltimos, sahifani qayta yuklang (F5).</p>
          <button onClick={() => window.location.reload()} style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: "#1D3A5F", color: "#fff", cursor: "pointer" }}>Qayta yuklash</button>
          <pre style={{ marginTop: 20, whiteSpace: "pre-wrap", fontSize: 12, color: "#993C1D" }}>{String(this.state.error && this.state.error.message || this.state.error)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><AuthGate /></ErrorBoundary>);
</script>
</body>
</html>
